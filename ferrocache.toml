# ferrocache configuration
# All values shown are defaults — uncomment and change as needed.

# port = 3000
# node_id = "my-node-1"    # auto-generated UUID if omitted
# wal_path = "./ferrocache.wal"

# Bearer token auth (M17). Unset/empty disables auth (default).
# Prefer setting via env: FERROCACHE_AUTH_TOKEN=...
# auth_token = "my-secret-token"

# [hnsw]
# max_nb_connection = 16
# max_elements = 100_000
# max_layer = 16
# ef_construction = 200
# ef_search = 32
# default_threshold = 0.92

# [cluster]
# enabled = false
# gossip_addr = "0.0.0.0:4000"
# api_addr = "0.0.0.0:3000"     # the HTTP addr peers reach to forward requests
# seed_nodes = []
# virtual_nodes = 64
# replication_factor = 2
# max_replication_retries = 3   # retries on connect/timeout/5xx; 4xx never retried

# Inter-node mTLS (M18). When enabled, ferrocache binds a SECOND listener
# on `internal_port` (default: port + 1000) for cluster traffic only. The
# public port stays plain HTTP. All nodes must share the same cluster CA;
# leave the *_path fields unset to auto-generate dev certs in memory
# (warning: every node will synthesize its own CA — only useful for a
# single-node smoke test, not a real cluster).
# [cluster.tls]
# enabled = false
# ca_cert_path = "/certs/ca.pem"
# node_cert_path = "/certs/node1/cert.pem"
# node_key_path = "/certs/node1/key.pem"
# internal_port = 4443
